name: Deploy (Cloudflare Workers, sem queda)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Marque para voltar à versão anterior em vez de publicar"
        type: boolean
        default: false

# Um deploy por vez; o novo espera o anterior terminar.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://ourivesaria.arcanestudios.io
    steps:
      - uses: actions/checkout@v6

      - name: Conferir se está pronto para publicar
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets da Cloudflare ainda não configurados. Deploy pulado (veja o DEPLOY.md)."
          elif [ "${{ github.event.inputs.rollback }}" != "true" ] && [ ! -f public/index.html ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::public/index.html não existe ainda. Deploy pulado."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (só se o projeto tiver)
        if: steps.cfg.outputs.ready == 'true' && github.event.inputs.rollback != 'true'
        run: |
          if [ -f package.json ] && node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            npm ci
            npm run build
          fi

      - name: Publicar versão nova
        if: steps.cfg.outputs.ready == 'true' && github.event.inputs.rollback != 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "${{ github.sha }}"

      - name: Testar o site no ar
        id: check
        if: steps.cfg.outputs.ready == 'true' && github.event.inputs.rollback != 'true'
        run: |
          curl -fsSL --max-time 20 --retry 6 --retry-delay 5 --retry-all-errors \
            -o /dev/null -H 'Cache-Control: no-cache' "$SITE_URL/?deploycheck=$(date +%s)"

      - name: Voltar à versão anterior (site não respondeu)
        if: failure() && steps.check.outcome == 'failure'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: rollback --yes --message "rollback automático ${{ github.sha }}"

      - name: Rollback manual
        if: steps.cfg.outputs.ready == 'true' && github.event.inputs.rollback == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: rollback --yes --message "rollback manual"
